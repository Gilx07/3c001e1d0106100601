<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050403" id="theme-color" />
  <meta name="description" content="Dolenthis — ruang kastil tua, kata-kata kuno, dan angka yang terus berubah." />
  <title>Dolenthis</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=UnifrakturCook:wght@700&display=swap');

    :root{
      --bg:#050403;--bg2:#090705;--wall:#0d0b09;--wall2:#15110d;--stone:#211a14;
      --floor:#070604;--panel:rgba(10,8,6,.72);--ink:#cfc2aa;--title:#cbbba0;
      --soft:#9b8d78;--muted:#6d6357;--faint:#312a23;--accent:#6d201d;
      --line:rgba(214,194,158,.12);--stage-border:#3c3329;--stage-glow:rgba(111,32,27,.1);
      --ring:rgba(210,190,155,.08);--vignette:rgba(0,0,0,.9);--dust:#6d4430;
      --count-bg:rgba(210,190,155,.07);--count-a:#4b1513;--count-b:#7c4336;--count-c:#a99478;
      --wood:#1b1009;--wood2:#382116;--paper:#8c7655;--paper-ink:#211910;
      --cursor-core:rgba(255,220,158,.28);--cursor-mid:rgba(234,188,116,.19);--cursor-wide:rgba(188,135,74,.11);
      --mx:50vw;--my:50vh;--px:0;--py:0;
    }

    body.ancient-light{
      --bg:#c8b792;--bg2:#b5a27d;--wall:#a58f69;--wall2:#8f7957;--stone:#746044;
      --floor:#776246;--panel:rgba(213,197,161,.66);--ink:#3a3125;--title:#443827;
      --soft:#564936;--muted:#6c5d47;--faint:#8a7656;--accent:#704136;--line:rgba(65,49,32,.24);
      --stage-border:#816b4b;--stage-glow:rgba(103,65,46,.1);--ring:rgba(55,42,29,.16);
      --vignette:rgba(55,37,19,.33);--dust:#6d513a;--count-bg:rgba(58,44,29,.13);
      --count-a:#6d4a3d;--count-b:#977455;--count-c:#4e3d2c;--wood:#442d1d;--wood2:#6d4b31;
      --paper:#c4ad7c;--paper-ink:#3a2b1e;--cursor-core:rgba(255,250,218,.35);
      --cursor-mid:rgba(255,232,177,.22);--cursor-wide:rgba(240,199,128,.13);
    }

    body.omen-666{
      --bg:#120101;--bg2:#210303;--wall:#230404;--wall2:#120101;--stone:#39100d;
      --floor:#0c0101;--panel:rgba(32,3,3,.86);--ink:#efb1a5;--title:#ff3d34;--soft:#c36b63;
      --muted:#9d4c47;--faint:#591616;--accent:#ff2118;--line:rgba(255,70,58,.3);
      --stage-border:#a41d19;--stage-glow:rgba(255,20,15,.24);--ring:rgba(255,70,60,.24);
      --vignette:rgba(45,0,0,.94);--dust:#e23930;--count-bg:rgba(255,70,60,.12);
      --count-a:#5a0000;--count-b:#cf140d;--count-c:#ff6d61;--wood:#2b0705;--wood2:#711610;
      --paper:#9f4b42;--paper-ink:#270302;--cursor-core:rgba(255,80,60,.34);
      --cursor-mid:rgba(255,30,20,.23);--cursor-wide:rgba(170,0,0,.15);
    }

    *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;transition:background 1.2s ease,color 1.2s ease}

    .scene{position:fixed;inset:0;z-index:-5;overflow:hidden;perspective:1100px;background:linear-gradient(#050403,#080604 68%,#030302);transform-style:preserve-3d}
    .room{position:absolute;inset:-3%;transform-style:preserve-3d;transform:rotateX(calc(var(--py)*-1deg)) rotateY(calc(var(--px)*1deg)) scale(1.035);transition:filter 1.2s ease}

    .back-wall{position:absolute;inset:0 10% 24% 10%;background:
      radial-gradient(circle at 73% 22%,rgba(111,20,15,.11),transparent 20%),
      repeating-linear-gradient(0deg,transparent 0 68px,rgba(225,205,165,.025) 69px 71px),
      repeating-linear-gradient(90deg,transparent 0 118px,rgba(225,205,165,.023) 119px 121px),
      linear-gradient(180deg,var(--wall2),var(--wall));
      box-shadow:inset 0 0 180px rgba(0,0,0,.72),0 30px 100px rgba(0,0,0,.5);transform:translateZ(-190px);}

    .left-wall,.right-wall{position:absolute;top:-4%;bottom:17%;width:34%;background:
      repeating-linear-gradient(0deg,transparent 0 62px,rgba(225,205,165,.025) 63px 65px),
      linear-gradient(90deg,var(--stone),var(--wall));filter:brightness(.55);box-shadow:inset 0 0 110px rgba(0,0,0,.55)}
    .left-wall{left:-14%;transform-origin:right center;transform:rotateY(67deg) translateZ(-70px)}
    .right-wall{right:-14%;transform-origin:left center;transform:rotateY(-67deg) translateZ(-70px)}

    .ceiling{position:absolute;left:-10%;right:-10%;top:-21%;height:36%;background:
      repeating-linear-gradient(90deg,transparent 0 13%,rgba(0,0,0,.28) 13.5% 15%),
      linear-gradient(var(--stone),#090705);transform-origin:bottom;transform:rotateX(-72deg) translateZ(-40px);filter:brightness(.5);box-shadow:0 50px 110px rgba(0,0,0,.55)}

    .floor{position:absolute;left:-16%;right:-16%;bottom:-26%;height:58%;background:
      linear-gradient(90deg,transparent 49.5%,rgba(220,200,160,.035) 50%,transparent 50.5%),
      repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 110px),
      repeating-linear-gradient(0deg,transparent 0 68px,rgba(225,205,165,.032) 69px 71px),
      linear-gradient(#0b0806,var(--floor));transform-origin:top;transform:rotateX(67deg) translateZ(20px);box-shadow:inset 0 120px 130px rgba(0,0,0,.5)}

    .column{position:absolute;top:0;bottom:18%;width:7.2%;background:
      linear-gradient(90deg,#080604 0,#2a2119 18%,#17120e 48%,#090705 100%);
      border-left:1px solid rgba(255,255,255,.025);border-right:1px solid rgba(0,0,0,.65);box-shadow:16px 0 34px rgba(0,0,0,.44),inset -10px 0 20px rgba(0,0,0,.35)}
    .column::before,.column::after{content:'';position:absolute;left:-12%;right:-12%;height:7%;background:linear-gradient(#2b2118,#0c0907);border:1px solid rgba(255,255,255,.025)}
    .column::before{top:0}.column::after{bottom:0}.c1{left:9%}.c2{right:9%}.c3{left:39%;width:4.5%;opacity:.35;transform:translateZ(-150px)}

    .window-recess{position:absolute;top:8vh;right:12vw;width:clamp(180px,20vw,300px);height:clamp(315px,47vh,470px);padding:14px;background:linear-gradient(110deg,#050403,#241910 46%,#080604);clip-path:polygon(12% 100%,12% 34%,16% 21%,24% 10%,36% 3%,50% 0,64% 3%,76% 10%,84% 21%,88% 34%,88% 100%);box-shadow:0 24px 70px rgba(0,0,0,.58);transform:translateZ(-35px)}
    .arch-window{position:absolute;inset:15px;border:8px solid #120e0b;border-bottom-width:16px;border-radius:50% 50% 3px 3px/27% 27% 3px 3px;background:
      radial-gradient(circle at 68% 28%,#c13229 0 8%,#78100d 9% 12%,rgba(117,12,10,.18) 13% 18%,transparent 19%),
      radial-gradient(ellipse at 50% 82%,#0e1016 0 26%,transparent 27%),
      linear-gradient(#02040a,#090c12 66%,#050608);box-shadow:inset 0 0 55px #000,0 0 0 2px rgba(189,160,120,.08),0 0 45px rgba(120,16,12,.08);overflow:hidden}
    .arch-window::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:7px;background:#100c09;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(255,255,255,.02)}
    .arch-window::after{content:'';position:absolute;left:0;right:0;top:53%;height:7px;background:#100c09;box-shadow:0 0 0 1px rgba(255,255,255,.02)}
    .moon-haze{position:absolute;right:14%;top:16%;width:48%;aspect-ratio:1;border-radius:50%;background:rgba(194,32,25,.19);filter:blur(24px);animation:moon 6s ease-in-out infinite}
    @keyframes moon{50%{opacity:.55;transform:scale(1.08)}}

    .table-wrap{position:absolute;left:5.5vw;bottom:7vh;width:clamp(330px,42vw,610px);height:230px;transform:translateZ(90px) rotateY(2deg);transform-style:preserve-3d;filter:drop-shadow(0 28px 26px rgba(0,0,0,.56))}
    .table-top{position:absolute;left:0;right:0;top:44px;height:92px;background:
      repeating-linear-gradient(1deg,transparent 0 18px,rgba(0,0,0,.14) 19px 20px),
      linear-gradient(#4a2b19,#211209 75%);border-top:9px solid #5a3823;box-shadow:inset 0 2px rgba(255,255,255,.045),inset 0 -24px 34px rgba(0,0,0,.35);transform:rotateX(7deg)}
    .table-top::before,.table-top::after{content:'';position:absolute;top:97%;width:12%;height:190px;background:linear-gradient(90deg,#4a2c1a,#1d1009,#4a2c1a);box-shadow:0 15px 24px rgba(0,0,0,.5)}
    .table-top::before{left:8%}.table-top::after{right:8%}

    .book{position:absolute;left:18%;top:0;width:47%;height:88px;transform:rotate(-4deg) rotateX(12deg);transform-style:preserve-3d;filter:drop-shadow(0 14px 10px rgba(0,0,0,.5))}
    .page{position:absolute;top:0;width:52%;height:100%;background:
      repeating-linear-gradient(to bottom,transparent 0 13px,color-mix(in srgb,var(--paper-ink) 28%,transparent) 14px 15px),
      linear-gradient(95deg,color-mix(in srgb,var(--paper) 75%,#4a3520),var(--paper));border:1px solid rgba(40,28,16,.35)}
    .page.left{left:0;transform:skewY(2deg);border-radius:7px 1px 1px 8px}.page.right{right:0;transform:skewY(-2deg);border-radius:1px 7px 8px 1px}
    .book::after{content:'';position:absolute;left:49%;top:2%;width:3%;height:96%;background:rgba(25,14,8,.55);box-shadow:0 0 8px rgba(0,0,0,.45)}
    .inkwell{position:absolute;right:18%;top:29px;width:42px;height:34px;border-radius:8px 8px 13px 13px;background:linear-gradient(110deg,#050505,#2b2924 50%,#060606);border:2px solid #3a362e;box-shadow:0 10px 10px rgba(0,0,0,.5)}
    .inkwell::before{content:'';position:absolute;left:7px;top:-8px;width:23px;height:8px;border:2px solid #484238;border-radius:50%;background:#070706}
    .quill{position:absolute;right:11%;top:-60px;width:7px;height:135px;background:linear-gradient(90deg,#413a2f,#c5b69a,#3b342b);transform:rotate(25deg);transform-origin:bottom;border-radius:70% 20% 20% 70%;filter:drop-shadow(0 5px 3px rgba(0,0,0,.35))}
    .quill::before{content:'';position:absolute;left:-29px;top:-6px;width:37px;height:90px;background:repeating-linear-gradient(160deg,transparent 0 7px,rgba(20,17,13,.46) 8px 9px),linear-gradient(135deg,#756b58,#c7b99d 55%,#51493d);clip-path:polygon(100% 0,82% 100%,58% 72%,0 91%,38% 50%,4% 20%,62% 29%)}

    .rat{position:absolute;bottom:4.8vh;width:32px;height:14px;border-radius:65% 48% 45% 55%;background:#14110e;box-shadow:inset -5px -3px 5px rgba(0,0,0,.55),0 4px 7px rgba(0,0,0,.45);opacity:.78}
    .rat::before{content:'';position:absolute;right:-7px;top:4px;width:10px;height:9px;border-radius:60%;background:#12100d;box-shadow:-2px -5px 0 -2px #211914}
    .rat::after{content:'';position:absolute;left:-34px;top:7px;width:38px;height:1px;background:#2b251f;transform-origin:right;transform:rotate(8deg)}
    .r1{left:-60px;animation:rat1 13s linear infinite}.r2{right:-70px;transform:scaleX(-1) scale(.78);animation:rat2 18s linear -8s infinite}.r3{left:-60px;bottom:10vh;transform:scale(.62);animation:rat1 22s linear -12s infinite;opacity:.42}
    @keyframes rat1{0%{translate:0 0}30%{translate:33vw -2px}34%{translate:35vw 0}65%{translate:72vw -1px}100%{translate:calc(100vw + 120px) 0}}
    @keyframes rat2{0%{translate:0 0}40%{translate:-46vw -2px}100%{translate:calc(-100vw - 140px) 0}}

    .cursor-glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
      radial-gradient(circle 115px at var(--mx) var(--my),var(--cursor-core),transparent 62%),
      radial-gradient(circle 250px at var(--mx) var(--my),var(--cursor-mid),transparent 68%),
      radial-gradient(circle 500px at var(--mx) var(--my),var(--cursor-wide),transparent 73%);mix-blend-mode:screen;filter:brightness(1.18)}
    body.ancient-light .cursor-glow{mix-blend-mode:soft-light;filter:brightness(1.05)}

    .noise{position:fixed;inset:0;z-index:49;pointer-events:none;opacity:.055;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
    .vignette{position:fixed;inset:0;z-index:47;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 24%,rgba(0,0,0,.35) 54%,var(--vignette) 100%)}
    .frame{position:fixed;inset:15px;border:1px solid var(--line);pointer-events:none;z-index:40}.frame::before,.frame::after{content:'✦';position:absolute;left:50%;transform:translateX(-50%);padding:0 12px;background:var(--bg);color:var(--faint);font-size:12px}.frame::before{top:-7px}.frame::after{bottom:-7px}

    .embers{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}.ember{position:absolute;bottom:-20px;width:2px;height:2px;border-radius:50%;background:var(--dust);opacity:0;animation:drift var(--duration) linear infinite;animation-delay:var(--delay);left:var(--left);box-shadow:0 0 7px color-mix(in srgb,var(--accent) 35%,transparent)}
    @keyframes drift{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.45}75%{opacity:.18}100%{transform:translate3d(var(--sway),-105vh,0);opacity:0}}

    .theme-toggle{position:fixed;top:30px;right:32px;z-index:60;width:56px;height:56px;border:1px solid var(--line);border-radius:50%;padding:0;color:var(--title);background:color-mix(in srgb,var(--panel) 90%,transparent);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(9px);box-shadow:inset 0 0 0 4px color-mix(in srgb,var(--faint) 12%,transparent),0 7px 25px rgba(0,0,0,.35);transition:.25s ease,background 1.2s ease,color 1.2s ease,border-color 1.2s ease}.theme-toggle:hover{transform:rotate(8deg) scale(1.04)}.theme-toggle:active{transform:scale(.96)}.theme-toggle svg{width:29px;height:29px}.sun-icon{display:none}body.ancient-light .star-icon{display:none}body.ancient-light .sun-icon{display:block}

    main{width:min(1120px,calc(100% - 48px));margin:0 auto;padding:82px 0 64px;position:relative;z-index:2}
    .hero{min-height:72vh;display:grid;place-items:center;text-align:center;animation:reveal 1.5s ease both}.hero-inner{width:min(900px,100%)}
    .sigil{width:82px;height:82px;margin:0 auto 28px;border:1px solid var(--faint);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:29px;transform:rotate(45deg);position:relative;opacity:.86;animation:breathe 5s ease-in-out infinite}.sigil span{transform:rotate(-45deg)}.sigil::before,.sigil::after{content:'';position:absolute;background:var(--faint)}.sigil::before{width:116px;height:1px}.sigil::after{width:1px;height:116px}@keyframes breathe{50%{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--accent) 29%,transparent))}}
    h1{margin:0;font-family:'UnifrakturCook','Times New Roman',serif;font-size:clamp(5.4rem,16vw,10.5rem);line-height:.86;font-weight:700;letter-spacing:-.035em;color:var(--title);text-shadow:0 2px 0 #000,0 0 34px rgba(110,55,35,.12)}
    .divider{margin:32px auto 26px;display:flex;align-items:center;justify-content:center;gap:14px;width:min(420px,80%);color:var(--accent)}.divider::before,.divider::after{content:'';height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--faint))}.divider::after{transform:scaleX(-1)}
    .tagline{margin:0 auto;max-width:650px;color:var(--soft);font-size:clamp(1.25rem,3vw,1.8rem);line-height:1.6;font-style:italic;text-shadow:0 2px 12px #000}.latin{min-height:1.4em;margin:24px 0 0;color:var(--muted);font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;opacity:1;transition:opacity .7s ease,color 1.2s ease}.latin.fading{opacity:0}
    .oracle-wrap{padding:58px 0 72px}.section-label{margin:0 0 12px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.38em;font-size:.68rem}.oracle{position:relative;width:min(760px,100%);margin:0 auto;padding:clamp(28px,6vw,54px);border:1px solid var(--line);background:linear-gradient(135deg,color-mix(in srgb,var(--ink) 3%,transparent),transparent 35%),var(--panel);backdrop-filter:blur(12px);text-align:center;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.34)}.oracle::before,.oracle::after{content:'';position:absolute;width:70px;height:70px;border-color:var(--line);pointer-events:none}.oracle::before{top:12px;left:12px;border-top:1px solid;border-left:1px solid}.oracle::after{right:12px;bottom:12px;border-right:1px solid;border-bottom:1px solid}.oracle h2{margin:0 0 30px;color:var(--ink);font-size:clamp(2rem,5vw,3.1rem);font-weight:500;letter-spacing:.04em}
    .number-stage{width:min(250px,65vw);aspect-ratio:1;margin:0 auto 28px;border:1px solid var(--stage-border);border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle,var(--stage-glow),transparent 64%)}.number-stage::before,.number-stage::after{content:'';position:absolute;border:1px solid var(--ring);border-radius:50%}.number-stage::before{inset:11px}.number-stage::after{inset:24px;border-style:dashed;animation:rotate 24s linear infinite}@keyframes rotate{to{transform:rotate(360deg)}}#number{position:relative;z-index:2;min-width:3ch;font-size:clamp(4rem,12vw,7rem);line-height:1;font-variant-numeric:tabular-nums;color:var(--title);text-shadow:0 0 28px color-mix(in srgb,var(--accent) 22%,transparent)}#number.reveal-number{animation:numberReveal .42s ease}@keyframes numberReveal{0%{opacity:.18;transform:scale(.82);filter:blur(5px)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
    .countdown{width:min(420px,90%);height:2px;margin:4px auto 0;background:var(--count-bg);overflow:hidden}.countdown-line{width:100%;height:100%;transform-origin:left;background:linear-gradient(90deg,var(--count-a),var(--count-b),var(--count-c));box-shadow:0 0 8px color-mix(in srgb,var(--accent) 25%,transparent)}@keyframes countdownShrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}.footer{padding:0 0 22px;color:var(--faint);text-align:center;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase}
    body.omen-666 .number-stage{box-shadow:0 0 80px rgba(255,0,0,.3),inset 0 0 50px rgba(255,0,0,.13)}
    @keyframes reveal{from{opacity:0;transform:translateY(18px);filter:blur(3px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}

    @media(max-width:700px){.frame{inset:8px}.theme-toggle{top:18px;right:18px;width:48px;height:48px}main{width:min(100% - 32px,1120px);padding-top:64px}.hero{min-height:78vh}.sigil{width:66px;height:66px}.sigil::before{width:92px}.sigil::after{height:92px}.oracle{padding:34px 20px}.window-recess{right:-5vw;opacity:.72}.table-wrap{left:-15vw;transform:scale(.78) translateZ(80px);transform-origin:left bottom}.cursor-glow{display:none}.column.c3{display:none}}
  </style>
</head>
<body>
  <div class="scene fall-layer" aria-hidden="true">
    <div class="room" id="room">
      <div class="back-wall"></div><div class="left-wall"></div><div class="right-wall"></div><div class="ceiling"></div><div class="floor"></div>
      <div class="column c1"></div><div class="column c2"></div><div class="column c3"></div>
      <div class="window-recess"><div class="arch-window"><div class="moon-haze"></div></div></div>
      <div class="table-wrap"><div class="table-top"></div><div class="book"><div class="page left"></div><div class="page right"></div></div><div class="inkwell"></div><div class="quill"></div></div>
      <div class="rat r1"></div><div class="rat r2"></div><div class="rat r3"></div>
    </div>
  </div>
  <div class="cursor-glow fall-layer" aria-hidden="true"></div><div class="noise fall-layer" aria-hidden="true"></div><div class="vignette fall-layer" aria-hidden="true"></div><div class="frame fall-layer" aria-hidden="true"></div>
  <div class="embers fall-layer" aria-hidden="true"><i class="ember" style="--left:8%;--delay:-2s;--duration:16s;--sway:25px"></i><i class="ember" style="--left:19%;--delay:-9s;--duration:20s;--sway:-18px"></i><i class="ember" style="--left:34%;--delay:-5s;--duration:18s;--sway:34px"></i><i class="ember" style="--left:51%;--delay:-13s;--duration:22s;--sway:-30px"></i><i class="ember" style="--left:68%;--delay:-7s;--duration:17s;--sway:20px"></i><i class="ember" style="--left:82%;--delay:-11s;--duration:21s;--sway:-24px"></i><i class="ember" style="--left:93%;--delay:-4s;--duration:19s;--sway:15px"></i></div>

  <button class="theme-toggle fall-layer" id="theme-toggle" type="button" aria-label="Ganti tema kuno">
    <svg class="star-icon" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="1" opacity=".45"/><path d="M32 5 L37 25 L54 16 L41 31 L59 35 L39 39 L48 56 L33 43 L28 60 L25 41 L8 49 L22 34 L5 29 L25 26 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="32" cy="32" r="4" fill="currentColor"/></svg>
    <svg class="sun-icon" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="32" cy="32" r="4" fill="currentColor"/><path d="M32 4v11M32 49v11M4 32h11M49 32h11M12 12l8 8M44 44l8 8M52 12l-8 8M20 44l-8 8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M32 18l4 7 8 1-6 6 2 8-8-4-8 4 2-8-6-6 8-1z" fill="none" stroke="currentColor" stroke-width="1" opacity=".55"/></svg>
  </button>

  <main class="fall-layer">
    <section class="hero" aria-labelledby="title"><div class="hero-inner"><div class="sigil" aria-hidden="true"><span>†</span></div><h1 id="title">Dolenthis</h1><div class="divider" aria-hidden="true">◆</div><p class="tagline">Ada hal-hal yang datang tanpa nama, bergerak pelan di antara cahaya, waktu, dan kemungkinan.</p><p class="latin" id="ancient-phrase" aria-live="polite">Lux in tenebris</p></div></section>
    <section class="oracle-wrap" id="oracle" aria-labelledby="oracle-title"><p class="section-label">Instrumentum Aleae</p><div class="oracle"><h2 id="oracle-title">The Number Oracle</h2><div class="number-stage"><div id="number" aria-live="polite">—</div></div><div class="countdown" aria-hidden="true"><div class="countdown-line" id="countdown-line"></div></div></div></section>
    <footer class="footer">Dolenthis · MMXXVI · The silence remembers</footer>
  </main>

  <script>
    (()=>{
      const body=document.body,numberEl=document.getElementById('number'),lineEl=document.getElementById('countdown-line'),phraseEl=document.getElementById('ancient-phrase'),themeToggle=document.getElementById('theme-toggle'),themeColorEl=document.getElementById('theme-color');
      const numberInterval=1500,phraseInterval=5000;let omenActive=false,savedLightTheme=false;
      const phrases=['Lux in tenebris','Memento vivere','Tempus fugit','Astra inclinant','Per aspera ad astra','Sic transit gloria','Nox profunda','Umbra manet','Vox antiqua','Silentium aeternum','Lumen occultum','Ordo ab chao','Fatum vocat','Ignis fatuus','Somnia vana','Via incognita','Anima mundi','Ars longa','Vita brevis','Sub rosa','In absentia','Ad infinitum','Ex nihilo','De profundis','In nocte','Terra incognita','Pax obscura','Vox nihili','Aeternum vale','Mutatis mutandis','Gnothi seauton','Panta rhei','Kairos','Aletheia','Nyx','Ananke','Moira','Logos','Kosmos','Erebus','Chronos','Skotos','Phos','Psyche','Eidolon','Lethe','Aion','Nostos','Oneiros','Aporia'];
      const rand=()=>Math.floor(Math.random()*999)+1;
      function resetLine(){lineEl.style.animation='none';void lineEl.offsetWidth;lineEl.style.animation=`countdownShrink ${numberInterval}ms linear forwards`}
      function omen(){if(omenActive)return;omenActive=true;savedLightTheme=body.classList.contains('ancient-light');body.classList.remove('ancient-light');body.classList.add('omen-666');themeToggle.disabled=true;themeColorEl.content='#120101';lineEl.style.animation='none';const layers=[...document.querySelectorAll('.fall-layer')];const anims=layers.map((el,i)=>{const r=el.getBoundingClientRect(),drop=Math.max(innerHeight+r.height+220,1000),drift=Math.random()*180-90,rot=Math.random()*14-7,delay=i*65+Math.random()*120;return el.animate([{transform:'translate3d(0,0,0) rotate(0deg)',opacity:1},{transform:`translate3d(${drift*.2}px,${drop*.16}px,0) rotate(${rot*.15}deg)`,opacity:.98,offset:.24},{transform:`translate3d(${drift*.58}px,${drop*.56}px,0) rotate(${rot*.62}deg)`,opacity:.78,offset:.66},{transform:`translate3d(${drift}px,${drop}px,0) rotate(${rot}deg)`,opacity:.05,filter:'blur(2px)'}],{duration:2500,delay,easing:'cubic-bezier(.16,.72,.18,1)',fill:'both'})});setTimeout(()=>{anims.forEach((a,i)=>{a.playbackRate=-(.7+i*.02);a.play()});Promise.all(anims.map(a=>a.finished.catch(()=>null))).then(()=>{anims.forEach(a=>a.cancel());body.classList.remove('omen-666');if(savedLightTheme)body.classList.add('ancient-light');themeColorEl.content=savedLightTheme?'#c8b792':'#050403';themeToggle.disabled=false;omenActive=false;resetLine()})},6600)}
      function reveal(){if(omenActive)return;const v=rand();numberEl.textContent=v;numberEl.classList.remove('reveal-number');void numberEl.offsetWidth;numberEl.classList.add('reveal-number');resetLine();if(v===666)omen()}
      let pi=Math.floor(Math.random()*phrases.length);phraseEl.textContent=phrases[pi];function changePhrase(){if(omenActive)return;phraseEl.classList.add('fading');setTimeout(()=>{if(omenActive)return;let n;do{n=Math.floor(Math.random()*phrases.length)}while(n===pi);pi=n;phraseEl.textContent=phrases[pi];phraseEl.classList.remove('fading')},700)}
      themeToggle.addEventListener('click',()=>{if(omenActive)return;const light=body.classList.toggle('ancient-light');themeColorEl.content=light?'#c8b792':'#050403'});
      let tx=innerWidth/2,ty=innerHeight/2,gx=tx,gy=ty,px=0,py=0;document.addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY},{passive:true});function cursor(){gx+=(tx-gx)*.16;gy+=(ty-gy)*.16;px+=(((tx/innerWidth)-.5)*2-px)*.05;py+=(((ty/innerHeight)-.5)*2-py)*.05;body.style.setProperty('--mx',gx+'px');body.style.setProperty('--my',gy+'px');body.style.setProperty('--px',px.toFixed(3));body.style.setProperty('--py',py.toFixed(3));requestAnimationFrame(cursor)}cursor();
      ['copy','cut','dragstart','contextmenu'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault()));
      reveal();setInterval(reveal,numberInterval);setInterval(changePhrase,phraseInterval);
    })();
  </script>
</body>
</html>
